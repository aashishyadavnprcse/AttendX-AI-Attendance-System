version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=AttendX AI Smart Attendance Backend
      - API_V1_STR=/api
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-attendx}:${POSTGRES_PASSWORD:-attendx_secure_pass}@db:5432/${POSTGRES_DB:-attendx}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - PRODUCTION_FRONTEND_URL=${PRODUCTION_FRONTEND_URL:-}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: attendx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attendx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendx_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-attendx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
